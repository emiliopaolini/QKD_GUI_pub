<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDN-QKD Dashboard</title>
    <style>
        /* General Styles */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        header p {
            font-size: 1rem;
            margin: 5px 0 0;
        }

        /* Tab Navigation */
        .tabs {
            display: flex;
            border-bottom: 2px solid #ccc;
            background: #fff;
            margin-top: 15px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .tab.active {
            background: #4caf50;
            color: white;
        }

        /* Tab Content */
        .tab-content {
            display: none;
            padding: 20px;
            background: #fff;
            border-radius: 5px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            margin: 20px auto;
            max-width: 800px;
        }

        .tab-content.active {
            display: block;
        }

        /* Form Styles */
        form {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-top: 10px;
        }

        input[type="text"], textarea {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            font-size: 1rem;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        button:hover:not(:disabled) {
            background: #388e3c;
        }

        /* Logs and Outputs */
        .logs {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            border-radius: 5px;
            font-size: 0.9rem;
            overflow-y: auto;
            max-height: 150px;
        }

        textarea {
            resize: none;
            height: 100px;
        }
    </style>
</head>
<body>
    <header>
        <h1>SDN-QKD Dashboard</h1>
        <p>Secure Quantum Key Distribution and Software-Defined Networking</p>
    </header>

    <!-- Tab Navigation -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('parameters')">Step 1: Input Parameters</div>
        <div class="tab" onclick="switchTab('registration')">Step 2: App Registration</div>
        <div class="tab" onclick="switchTab('key-session')">Step 3: Open Key Session</div>
        <div class="tab" onclick="switchTab('get-keys')">Step 4: Get Keys</div>
    </div>

    <!-- Tab Contents -->
    <div id="parameters" class="tab-content active">
        <h2>Input Parameters</h2>
        <form id="parameters-form">
            <label for="app_name">App Name:</label>
            <input type="text" id="app_name" placeholder="Alice or Bob">
            
            <label for="my_ip">My IP:</label>
            <input type="text" id="my_ip" value="10.30.2.117">
            
            <label for="my_port">My Port:</label>
            <input type="text" id="my_port" value="1234">
            
            <label for="controller_ip">Controller IP:</label>
            <input type="text" id="controller_ip" value="146.48.81.163">
            
            <label for="key_manager_ip">Key Manager IP:</label>
            <input type="text" id="key_manager_ip" value="10.79.1.47">
            
            <label for="key_manager_port">Key Manager Port:</label>
            <input type="text" id="key_manager_port" value="8001">
            
            <label for="other_app_ip">Other App IP:</label>
            <input type="text" id="other_app_ip" value="10.30.2.118">
            
            <label for="other_app_port">Other App Port:</label>
            <input type="text" id="other_app_port" value="1234">
            
            <button type="button" onclick="saveParameters()">Save Parameters</button>
        </form>
    </div>

    <div id="registration" class="tab-content">
        <h2>App Registration</h2>
        <button id="register-btn" onclick="appRegistration()" disabled>Register App</button>
        <div class="logs" id="registration-log"></div>
    </div>

    <div id="key-session" class="tab-content">
        <h2>Open Key Session</h2>
        <button id="key-session-btn" onclick="openKeySession()" disabled>Open Key Session</button>
        <div class="logs" id="key-session-log"></div>
    </div>

    <div id="get-keys" class="tab-content">
        <h2>Get Keys</h2>
        <label for="key_length">Key Length:</label>
        <input type="text" id="key_length" value="128">
        
        <label for="number_keys">Number of Keys:</label>
        <input type="text" id="number_keys" value="1">
        
        <button onclick="getKeys()">Retrieve Keys</button>
        <textarea id="keys-output" readonly></textarea>
    </div>

    <script src="http://localhost:7001/socket.io/socket.io.js"></script>
    <script>
        const socket = io('http://localhost:7001');
        let parameters = {};

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function saveParameters() {
            parameters = {
                appName: document.getElementById('app_name').value,
                myIP: document.getElementById('my_ip').value,
                myPort: document.getElementById('my_port').value,
                controllerIP: document.getElementById('controller_ip').value,
                keyManagerIP: document.getElementById('key_manager_ip').value,
                keyManagerPort: document.getElementById('key_manager_port').value,
                otherAppIP: document.getElementById('other_app_ip').value,
                otherAppPort: document.getElementById('other_app_port').value
            };
            alert('Parameters saved successfully!');
            document.getElementById('register-btn').disabled = false;
            switchTab('registration');
        }

        function appRegistration() {
            socket.emit('app_registration', parameters);
            socket.on('get_app_registration', (response) => {
                const log = response.code === 200
                    ? `App Registration Successful: SAE ID - ${response.body?.sae_id || "N/A"}`
                    : `Registration Failed: ${response.body}`;
                document.getElementById('registration-log').textContent = log;
                if (response.code === 200) {
                    document.getElementById('key-session-btn').disabled = false;
                    // switchTab('key-session');
                }
            });
        }

        function openKeySession() {
            socket.emit('open_key_session', parameters);
            socket.on('get_open_key_session', (response) => {
                const log = response.code === 200
                    ? `Key Session Opened: App ID - ${response.app_id}, Other SAE ID - ${response.other_app_sae_id}`
                    : `Failed to Open Session: ${response.body}`;
                document.getElementById('key-session-log').textContent = log;
                if (response.code === 200) {
                    // switchTab('get-keys');
                }
            });
        }

        function getKeys() {
            const keyData = {
                keyLength: document.getElementById('key_length').value,
                numberOfKeys: document.getElementById('number_keys').value,
            };

            socket.emit('get_key', keyData);
            socket.on('response_get_key', (response) => {
                if (response.code === 200) {
                    let keysOutput = response.keys.map(key => `Key ID: ${key.key_ID}\nKey: ${key.key}`).join("\n\n");
                    document.getElementById('keys-output').value = keysOutput;
                    alert("Keys retrieved successfully!");
                } else {
                    alert(`Failed to retrieve keys: ${response.body}`);
                }
            });
        }
    </script>
</body>
</html>
